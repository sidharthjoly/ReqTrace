<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReqTrace</title>
<style>
  :root {
    --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b66; --line:#e5e4e0;
    --accent:#2f6f4f; --accent-soft:#e8f1ec; --chip:#f2f1ee; --warn:#8a5a20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#161614; --panel:#1e1e1c; --ink:#eceae5; --muted:#9a978f; --line:#33322e;
      --accent:#7fc4a0; --accent-soft:#1f2f27; --chip:#272621; --warn:#d9a441;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:22px 20px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:19px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; }
  .searchrow { display:flex; gap:8px; margin-top:14px; }
  input[type=search] { flex:1; padding:10px 12px; font-size:15px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  input[type=search]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  select, button { font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
  .chip { padding:5px 10px; border-radius:999px; background:var(--chip);
    border:1px solid transparent; font-size:13px; cursor:pointer; user-select:none; }
  .chip[aria-pressed=true] { background:var(--accent-soft); border-color:var(--accent);
    color:var(--accent); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:16px 20px 60px; }
  .count { color:var(--muted); font-size:13px; margin:6px 0 12px; }
  .job { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px; }
  .job h2 { margin:0 0 3px; font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .job h2 a { color:inherit; text-decoration:none; }
  .job h2 a:hover { color:var(--accent); text-decoration:underline; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    color:var(--muted); font-size:13px; }
  .co { color:var(--ink); font-weight:500; }
  .badge { font-size:11px; padding:2px 7px; border-radius:5px; background:var(--chip);
    text-transform:uppercase; letter-spacing:.04em; }
  .badge.remote { background:var(--accent-soft); color:var(--accent); }
  .badge.salary { background:var(--accent-soft); color:var(--accent); font-weight:600;
    text-transform:none; letter-spacing:0; }
  .badge.fresh { background:var(--accent-soft); color:var(--accent); }
  .snip { margin-top:7px; color:var(--muted); font-size:13px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  .more { display:block; width:100%; margin-top:10px; padding:10px; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:0 20px 30px; }
  nav { margin-top:12px; display:flex; gap:6px; }
  nav a { font-size:13px; padding:5px 11px; border-radius:999px; background:var(--chip);
    color:var(--ink); text-decoration:none; }
  nav a[aria-current=page] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
</style>

<header><div class="wrap">
  <h1>ReqTrace</h1>
  <div class="sub" id="stats">loading index…</div>
  <div class="searchrow">
    <input type="search" id="q" placeholder="data scientist, causal inference, forecasting…" autofocus>
    <select id="sort">
      <option value="newest">Newest</option>
      <option value="relevance">Relevance</option>
      <option value="salary">Salary</option>
    </select>
  </div>
  <div class="filters">
    <span class="chip" id="f-data" aria-pressed="true">Data roles</span>
    <span class="chip" id="f-salary" aria-pressed="false">Has salary</span>
    <span class="chip" id="f-remote" aria-pressed="false">Remote only</span>
    <span class="chip" id="f-fresh" aria-pressed="false">New this week</span>
    <select id="city"><option value="">All cities</option></select>
    <select id="company"><option value="">All employers</option></select>
    <select id="vendor"><option value="">All sources</option></select>
  </div>
  <nav>
    <a href="index.html" aria-current="page">Search</a>
    <a href="runs.html">Ingest health</a>
  </nav>
</div></header>

<main>
  <div class="count" id="count"></div>
  <div id="results"></div>
  <button class="more" id="more" hidden>Load more</button>
</main>
<footer>Pulled straight from employers' ATS feeds — one record per requisition,
apply links go to the employer. Roles that close disappear on the next run.</footer>

<script>
const $ = s => document.querySelector(s);
const state = { offset: 0, total: 0 };

function params(offset = 0) {
  const p = new URLSearchParams();
  if ($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if ($('#f-data').ariaPressed === 'true') p.set('data_only', '1');
  if ($('#f-salary').ariaPressed === 'true') p.set('has_salary', '1');
  if ($('#f-remote').ariaPressed === 'true') p.set('remote', 'remote');
  if ($('#f-fresh').ariaPressed === 'true') p.set('days', '7');
  for (const id of ['city', 'company', 'vendor']) if ($('#' + id).value) p.set(id, $('#' + id).value);
  p.set('sort', $('#sort').value);
  p.set('offset', offset);
  return p;
}

// Prefer the employer's own publish date; first_seen_at only records when this
// index noticed the role, which would read "today" for every row on a fresh DB.
const daysAgo = j => {
  const iso = j.posted_at || j.first_seen_at;
  if (!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso.replace(' ', 'T'))) / 864e5);
  return Number.isFinite(d) ? Math.max(d, 0) : null;
};

const ago = d => d === null ? '' : (d === 0 ? 'today' : d === 1 ? 'yesterday'
  : d < 30 ? d + 'd ago' : d < 365 ? Math.round(d / 30) + 'mo ago' : 'over a year ago');

const money = j => {
  if (!j.salary_min) return null;
  const f = n => (n >= 1000 ? Math.round(n / 1000) + 'k' : n);
  const cur = (j.salary_currency || '').replace('AUD', 'A$').replace('USD', 'US$');
  const range = j.salary_max && j.salary_max !== j.salary_min
    ? `${f(j.salary_min)}–${f(j.salary_max)}` : f(j.salary_min);
  return `${cur}${range}${j.salary_period ? '/' + j.salary_period : ''}`;
};

const esc = s => (s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function card(j) {
  const d = daysAgo(j);
  const where = [j.location_city, j.location_country].filter(Boolean).join(', ') || j.location_raw || '—';
  const sal = money(j);
  return `<article class="job">
    <h2><a href="${esc(j.apply_url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
    <div class="meta">
      <span class="co">${esc(j.company)}</span><span>·</span><span>${esc(where)}</span>
      ${j.remote_type && j.remote_type !== 'unknown' ? `<span class="badge ${j.remote_type === 'remote' ? 'remote' : ''}">${j.remote_type}</span>` : ''}
      ${sal ? `<span class="badge salary">${esc(sal)}</span>` : ''}
      ${d !== null && d <= 7 ? `<span class="badge fresh">${ago(d)}</span>`
        : (d !== null ? `<span>${ago(d)}</span>` : '')}
      ${j.seniority && j.seniority !== 'Not Applicable' ? `<span>${esc(j.seniority)}</span>` : ''}
    </div>
    ${j.snippet ? `<div class="snip">${esc(j.snippet)}</div>` : ''}
  </article>`;
}

// Two backends behind one page. Served by reqtrace.web it queries /api/search
// against FTS5; served as a static export (GitHub Pages, or just opening the
// file) it loads the whole AU set once and filters in the browser. 3,356 rows
// is small enough that a search library would be ceremony — and it is exactly
// why the export is AU-only: the full 51k index is 28MB.
const STATIC = { on: false, jobs: [], data: [], exclude: [], as_of: null };

async function detectStatic() {
  try {
    const r = await fetch('data/manifest.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const m = await r.json();
    // The data-role terms come from the export, never retyped here: the server
    // filter was already subtly wrong once ("Senior Tax Analyst"), and two
    // copies of it would drift apart on the next fix.
    STATIC.data = m.data_terms; STATIC.exclude = m.analyst_exclude;
    STATIC.as_of = m.generated_at;
    STATIC.jobs = await (await fetch('data/jobs.json')).json();
    STATIC.on = true;
    return true;
  } catch { return false; }
}

const pad = t => ' ' + (t || '').toLowerCase() + ' ';
const isDataRole = t => {
  const s = pad(t);
  if (STATIC.data.some(x => s.includes(x))) return true;
  return s.includes('analyst') && !STATIC.exclude.some(x => s.includes(x));
};

function searchLocal(p) {
  const q = (p.get('q') || '').toLowerCase().trim();
  // FTS5 prefix-matches each term; substring matching here is slightly looser.
  const terms = q ? q.split(/\s+/).filter(Boolean) : [];
  const cutoff = p.get('days')
    ? Date.now() - (+p.get('days')) * 864e5 : null;

  let rows = STATIC.jobs.filter(j => {
    if (p.get('data_only') && !isDataRole(j.title)) return false;
    if (p.get('has_salary') && j.salary_min == null) return false;
    if (p.get('remote') && j.remote_type !== p.get('remote')) return false;
    for (const k of ['city', 'company', 'vendor']) {
      const want = p.get(k);
      if (!want) continue;
      const got = k === 'city' ? j.location_city
        : k === 'company' ? j.company : j.ats_vendor;
      if (got !== want) return false;
    }
    if (cutoff !== null) {
      const d = new Date((j.posted_at || j.first_seen_at || '').replace(' ', 'T'));
      if (!(d >= cutoff)) return false;
    }
    if (terms.length) {
      const hay = `${j.title} ${j.company} ${j.snippet || ''}`.toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });

  const when = j => new Date((j.posted_at || j.first_seen_at || 0)
    .toString().replace(' ', 'T')).getTime() || 0;
  const sort = p.get('sort');
  if (sort === 'salary') {
    rows.sort((a, b) => (b.salary_max ?? -Infinity) - (a.salary_max ?? -Infinity)
      || when(b) - when(a));
  } else if (sort === 'relevance' && terms.length) {
    // The server ranks with FTS5 bm25. Approximated here as "how many query
    // terms hit the title", which is the part of bm25 a reader would notice.
    const score = j => terms.filter(t => j.title.toLowerCase().includes(t)).length;
    rows.sort((a, b) => score(b) - score(a) || when(b) - when(a));
  } else {
    rows.sort((a, b) => when(b) - when(a));
  }

  const off = +p.get('offset') || 0;
  return { total: rows.length, results: rows.slice(off, off + 50),
           facets: off ? null : localFacets() };
}

function localFacets() {
  const top = (key, n) => {
    const c = new Map();
    for (const j of STATIC.jobs) {
      const v = key(j);
      if (v) c.set(v, (c.get(v) || 0) + 1);
    }
    return [...c].sort((a, b) => b[1] - a[1]).slice(0, n)
      .map(([k, v]) => ({ key: k, n: v }));
  };
  return {
    cities: top(j => j.location_city, 12),
    companies: top(j => j.company, 15),
    vendors: top(j => j.ats_vendor, 6),
    remote: top(j => j.remote_type, 6),
  };
}

let timer;
async function load(more = false) {
  state.offset = more ? state.offset + 50 : 0;
  const p = params(state.offset);
  const d = STATIC.on ? searchLocal(p)
    : await (await fetch('/api/search?' + p)).json();
  state.total = d.total;
  $('#count').textContent = `${d.total.toLocaleString()} matching role${d.total === 1 ? '' : 's'}`;
  const html = d.results.map(card).join('');
  $('#results').innerHTML = more ? $('#results').innerHTML + html : (html ||
    '<div class="empty">Nothing matches. Try dropping a filter.</div>');
  $('#more').hidden = state.offset + d.results.length >= d.total;
  if (!more) fillFacets(d.facets);
}

let facetsDone = false;
function fillFacets(f) {
  if (facetsDone || !f) return;
  facetsDone = true;
  const fill = (sel, items) => {
    const el = $(sel);
    for (const it of items) {
      if (!it.key) continue;
      const o = document.createElement('option');
      o.value = it.key; o.textContent = `${it.key} (${it.n})`;
      el.append(o);
    }
  };
  fill('#city', f.cities); fill('#company', f.companies); fill('#vendor', f.vendors);
}

for (const id of ['#f-data', '#f-salary', '#f-remote', '#f-fresh']) {
  $(id).onclick = e => {
    e.target.ariaPressed = e.target.ariaPressed === 'true' ? 'false' : 'true';
    load();
  };
}
for (const id of ['#city', '#company', '#vendor', '#sort']) $(id).onchange = () => load();
$('#q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 220); };
$('#more').onclick = () => load(true);

const summarise = s =>
  `${s.au_open.toLocaleString()} open Australian roles · ${s.boards} employer boards · ` +
  `${s.vendors} ATS sources · ${s.closed.toLocaleString()} closed and retired`;

detectStatic().then(async isStatic => {
  if (isStatic) {
    const m = await (await fetch('data/manifest.json')).json();
    // A static export is a snapshot, not a live index. Say when it was taken —
    // without it the page silently claims yesterday's roles are open today.
    $('#stats').textContent = summarise(m.stats) + ' · exported ' +
      new Date(m.generated_at).toLocaleString(undefined,
        { dateStyle: 'medium', timeStyle: 'short' });
    // The live index searches full descriptions through FTS5; the export
    // carries a 320-character preview, so a query whose only match is deep in
    // a body finds nothing here. That is a smaller result set for a reason,
    // and the page should say which reason rather than look under-populated.
    const note = document.createElement('div');
    note.className = 'sub';
    note.style.marginTop = '8px';
    note.textContent = 'Static snapshot of open Australian roles. Search covers '
      + 'titles, employers and description previews — the live index searches '
      + 'full descriptions.';
    $('.filters').after(note);
  } else {
    $('#stats').textContent = summarise(await (await fetch('/api/stats')).json());
  }
  load();
});
</script>

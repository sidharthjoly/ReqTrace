# The crawler that doesn't stop, on somebody else's computer.
#
# "Infinite" and "a six-hour job ceiling" are not actually in tension, because
# the frontier lives in Postgres rather than in the process. Each run claims
# work, crawls politely for a bounded window, writes back what it found, and
# exits; the next run picks up precisely where this one stopped. The crawl is
# continuous even though no single process is.
#
# Four 45-minute runs a day. The repo is public so runner minutes are free,
# and the only remaining limit is the one that always mattered: these are other
# people's web servers. A 25-page lap plus 20 seconds of rest is ~35 seconds,
# so this is roughly 4,600 pages a day — about three a minute, spread over
# thousands of hosts, and no single host can receive more than 12 pages ever.
#
# Underneath that, every politeness rule in `crawl.py` still applies per host:
# robots.txt including Crawl-delay, one request at a time, a declared
# User-Agent, byte caps. Free minutes changed how often this runs; they did not
# change what it is allowed to do.
name: Crawl for employers

on:
  schedule:
    # Four times a day, in the gaps between the six sweeps (which run at :30
    # past 03/07/11/15/19/23 and take roughly 75 minutes).
    #
    # The shared `reqtrace-pipeline` concurrency group is what actually
    # guarantees they do not overlap — but GitHub keeps only ONE pending run
    # per group and discards an older pending one when a newer arrives, so a
    # slot that habitually collided would not merely wait, it would silently
    # skip crawls. Landing in a real gap keeps the queue empty.
    - cron: "10 1,9,13,21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to crawl for."
        required: false
        default: "45"
      expand:
        description: "Harvest new employer domains from directory pages."
        type: boolean
        default: true
      seed:
        description: "Seed sets to (re)queue first, e.g. au,global,audit. Blank to skip."
        required: false
        default: ""

env:
  # See the note in sweep.yml: a killed job must not take its log with it.
  PYTHONUNBUFFERED: "1"

concurrency:
  # Shared with sweep.yml, not a group of its own. The cron offset alone is not
  # the guarantee the header claims: a sweep that overruns past 02:15 would
  # have this job's `adopt` rewriting `data/discovered_boards.csv` while the
  # sweep is reading it, and both are writing the same database. One name for
  # both workflows makes GitHub enforce what the schedule only suggests.
  group: reqtrace-pipeline
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # commits newly adopted boards to data/

    steps:
      - name: Refuse to run without a database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL secret. The frontier IS the" \
              "database — with SQLite on an ephemeral runner every run would" \
              "start from an empty queue, re-fetch every page it has ever" \
              "seen, and find nothing new. Add the secret before enabling."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # `--minutes`, not `--laps`: how long a lap takes is emergent (how many
      # claimed URLs share a host, what Crawl-delay those hosts declare, how
      # many time out), so converting a time budget into a lap count ahead of
      # time is guesswork. Measured, a 25-page lap is closer to 10 seconds than
      # to the 15 minutes an earlier version of this file assumed.
      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS="--minutes ${{ inputs.minutes || 45 }} --lap-pages 25 --rest 20"
          if [ "${{ inputs.expand }}" != "false" ]; then ARGS="$ARGS --expand"; fi
          if [ -n "${{ inputs.seed }}" ]; then ARGS="$ARGS --seed ${{ inputs.seed }}"; fi
          uv run python scripts/crawl_forever.py $ARGS

      # Adoption writes `data/discovered_boards.csv` and commits it in one
      # step, because that file — not the database — is what ingestion reads.
      #
      # The rebase happens BEFORE adopt, not after the commit. This file is
      # sorted by (vendor, token), so two runs adding boards interleave into
      # the same regions of it and rebasing a finished commit onto someone
      # else's would conflict exactly when it matters. Pulling first means the
      # adopt runs against current content and produces a commit that already
      # applies cleanly.
      #
      # `adopt` is idempotent — it offers whatever the CSV does not already
      # list, regardless of the `adopted_at` flag — so a push that fails here
      # costs nothing but a retry: the next run offers the same boards again.
      - name: Adopt what it found
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          uv run python scripts/crawl_forever.py adopt

          if git diff --quiet -- data/discovered_boards.csv; then
            echo "no new boards to commit"
            exit 0
          fi
          git add data/discovered_boards.csv
          N=$(git diff --cached --numstat -- data/discovered_boards.csv \
              | awk '{print $1}')
          git commit -m "Adopt ${N:-new} boards found by the continuous crawl"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: What the crawl knows now
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          {
            echo '```'
            uv run python scripts/crawl_forever.py status 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
